name: 물 마시기 푸시 알림

# cron 시간은 UTC 기준이에요. 한국 시간(KST)은 9시간을 더하면 돼요.
# GitHub 예약 실행은 붐빌 때 몇 시간씩 늦게 시작될 수 있어요.
on:
  schedule:
    - cron: '0 1 * * 1-5'    # 10:00 KST 평일 (오전 1잔)
    - cron: '30 2 * * 1-5'   # 11:30 KST 평일 (오전 2잔)
    - cron: '0 5 * * 1-5'    # 14:00 KST 평일 (오후 1잔)
    - cron: '0 7 * * 1-5'    # 16:00 KST 평일 (오후 2잔)
    - cron: '0 9 * * 1-5'    # 18:00 KST 평일 (오후 3잔)
    - cron: '0 2 * * 0,6'    # 11:00 KST 주말 리마인드
    - cron: '0 5 * * 0,6'    # 14:00 KST 주말 리마인드
    - cron: '0 8 * * 0,6'    # 17:00 KST 주말 리마인드
  # Actions 탭에서 수동 테스트용
  workflow_dispatch:
    inputs:
      slot:
        description: '알림 칸 (평일 w1~w5, 주말 e1~e3, 비우면 테스트 알림)'
        type: string
        required: false
        default: ''

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install firebase-admin
        run: pip install firebase-admin

      - name: Send FCM push
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SCHEDULE: ${{ github.event.schedule }}
          SLOT: ${{ github.event.inputs.slot }}
        run: python send_push.py
