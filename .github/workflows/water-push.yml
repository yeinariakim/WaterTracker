name: 물 마시기 푸시 알림

# GitHub 예약 실행(schedule)은 몇 시간씩 늦게 시작될 때가 있어서 쓰지 않아요.
# 대신 외부 스케줄러(cron-job.org)가 정해진 시각에 이 워크플로를 API로 실행해요.
# 설정 방법은 CRON_JOB_SETUP.md를 봐주세요.
on:
  workflow_dispatch:
    inputs:
      slot:
        description: '알림 칸 (평일 w1~w5, 주말 e1~e3, 비우면 테스트 알림)'
        type: string
        required: false
        default: ''

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install firebase-admin
        run: pip install firebase-admin

      - name: Send FCM push
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SLOT: ${{ github.event.inputs.slot }}
        run: python send_push.py
