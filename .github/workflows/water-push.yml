name: 물 마시기 푸시 알림

on:
  schedule:
    - cron: '0 1 * * 1-5'    # 10:00 KST (오전 1잔)
    - cron: '30 2 * * 1-5'   # 11:30 KST (오전 2잔)
    - cron: '0 5 * * 1-5'    # 14:00 KST (오후 1잔)
    - cron: '30 7 * * 1-5'   # 16:30 KST (오후 2잔)
    - cron: '0 9 * * 1-5'    # 18:00 KST (오후 3잔)
  workflow_dispatch: {}   # Actions 탭에서 수동 테스트용

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install firebase-admin
        run: pip install firebase-admin

      - name: Send FCM push
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SCHEDULE: ${{ github.event.schedule }}
        run: python send_push.py
